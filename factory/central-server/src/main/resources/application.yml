spring:
  application:
    name: factory-central-server
  datasource:
    # reWriteBatchedInserts: 7일치 가져오기의 batch insert 를 빠르게
    url: jdbc:postgresql://${FACTORY_DB_HOST:localhost}:${FACTORY_DB_PORT:5432}/${FACTORY_DB_NAME:argos_factory}?reWriteBatchedInserts=true
    username: ${FACTORY_DB_USERNAME:argos_factory}
    password: ${FACTORY_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Seoul

server:
  port: ${FACTORY_SERVER_PORT:8081}

argos:
  zone: Asia/Seoul
  clock:
    # 시연 시계: 서버가 켜진 순간이 이 시각이 된다 (발표 날짜와 상관없이 "그날은 11/16 09:00")
    sim-start: ${ARGOS_SIM_START:2026-11-16T09:00:00+09:00}
  history-import:
    # true 면 서버 시작 때 7일치 더미데이터를 가져온다 (이미 있으면 건너뜀)
    enabled: ${ARGOS_HISTORY_IMPORT:false}
    # central-server 폴더에서 실행할 때 기준 경로
    path: ${ARGOS_HISTORY_PATH:../raw-data/dummy-data}
    reset: ${ARGOS_HISTORY_RESET:false}
  # 개발·시연용 API (/api/v1/dev/**). 운영에서는 false
  dev-api: ${ARGOS_DEV_API:false}
  # 연계 서버 전용 API(/api/v1/internal/**) 키. 연계 서버는 X-Argos-Internal-Key 헤더로 보낸다. 비우면 검사 안 함
  internal-api-key: ${ARGOS_INTERNAL_API_KEY:}
  # 센서 값(그래프용 1분 추이·경보 샘플) 보관 기간. 1시간마다 시연 시계 기준 N일 지난 값을 지운다.
  # 경보·이벤트 이력과 경보 이미지는 지우지 않는다 (통계·월간 보고서용)
  retention:
    enabled: ${ARGOS_RETENTION_ENABLED:true}
    days: ${ARGOS_RETENTION_DAYS:7}
    # (2026-11-19 ERD V6) 위 days 대신 이 값을 쓴다: 1분 추이·이벤트 샘플·알림 센서 샘플 31일 보관
    # (통계·이력은 한 번에 30일까지 조회, docs/api/stats-history-30days.md). 이벤트·경보·명령 이력은 지우지 않는다
    keep-days: ${ARGOS_RETENTION_KEEP_DAYS:31}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
