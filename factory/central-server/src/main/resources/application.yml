spring:
  application:
    name: factory-central-server
  # 엣지(DAS) Kafka (argos.kafka.enabled=true 일 때만 연결). 명세: docs/ArgOS_Kafka_메시지_명세.md
  kafka:
    bootstrap-servers: ${ARGOS_KAFKA_BOOTSTRAP:localhost:9092}
    client-id: argos-collector
    producer:
      properties:
        # 브로커가 없을 때 명령 보내기가 오래 멈추지 않게 (3초 뒤 FAILED)
        max.block.ms: 3000
    consumer:
      # 결과는 PC(서버)마다 따로 받는다. 같은 그룹이면 명령을 보낸 서버가 결과를 못 받을 수 있음
      group-id: ${ARGOS_KAFKA_GROUP_ID:argos-collector-${COMPUTERNAME:${HOSTNAME:local}}}
      auto-offset-reset: latest
  datasource:
    # reWriteBatchedInserts: 7일치 가져오기의 batch insert 를 빠르게
    url: jdbc:postgresql://${FACTORY_DB_HOST:localhost}:${FACTORY_DB_PORT:5432}/${FACTORY_DB_NAME:argos_factory}?reWriteBatchedInserts=true
    username: ${FACTORY_DB_USERNAME:argos_factory}
    password: ${FACTORY_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Seoul
  # 데이터 수집 서버 ↔ 중앙 서버 Redis (argos.redis.enabled=true 일 때만 연결)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false

server:
  port: ${FACTORY_SERVER_PORT:8081}

argos:
  zone: Asia/Seoul
  clock:
    # 시연 시계: 서버가 켜진 순간이 이 시각이 된다 (발표 날짜와 상관없이 "그날은 11/16 09:00")
    # (2026-11-20 추가) 시연 시계는 쓰지 않는다. 지금은 항상 실제 서버 시각이고, sim-start 는 7일치 더미가 끝나는 시각(더미 가져오기·리셋의 경계)으로만 쓴다
    sim-start: ${ARGOS_SIM_START:2026-11-16T09:00:00+09:00}
  history-import:
    # true 면 서버 시작 때 7일치 더미데이터를 가져온다 (이미 있으면 건너뜀)
    enabled: ${ARGOS_HISTORY_IMPORT:false}
    # central-server 폴더에서 실행할 때 기준 경로
    path: ${ARGOS_HISTORY_PATH:../raw-data/dummy-data}
    reset: ${ARGOS_HISTORY_RESET:false}
  # 개발·시연용 API (/api/v1/dev/**). 운영에서는 false
  dev-api: ${ARGOS_DEV_API:false}
  # 연계 서버 전용 API(/api/v1/internal/**) 키. 연계 서버는 X-Argos-Internal-Key 헤더로 보낸다. 비우면 검사 안 함
  internal-api-key: ${ARGOS_INTERNAL_API_KEY:}
  # 엣지(DAS) Kafka 로 배기팬 명령 보내기 (FAN_HZ · FAN_STOP). false 면 지금처럼 시뮬레이션(1초 뒤 완료).
  # 셧다운·재가동은 엣지 명세에 없어서 항상 시뮬레이션
  # 켜면 엣지 센서값(argos.edge.raw)·단계(argos.edge.stage)도 받는다: 단계는 엣지 판정 그대로 이벤트로,
  # 경보는 관제 단위로 묶어서 만든다. 기준값은 서버 시작·변경 때 argos.config.threshold 로 보낸다
  kafka:
    enabled: ${ARGOS_KAFKA_ENABLED:false}
    # 엣지로 보내는 기준값의 연속 횟수 (엣지는 1초 샘플. 팀 결정 주의 15 · 경보 15 · 복귀 20)
    edge-samples:
      warn: ${ARGOS_EDGE_WARN_SAMPLES:15}
      alarm: ${ARGOS_EDGE_ALARM_SAMPLES:15}
      release: ${ARGOS_EDGE_RELEASE_SAMPLES:20}
  # 센서 값(그래프용 1분 추이·경보 샘플) 보관 기간. 1시간마다 시연 시계 기준 N일 지난 값을 지운다.
  # 경보·이벤트 이력과 경보 이미지는 지우지 않는다 (통계·월간 보고서용)
  retention:
    enabled: ${ARGOS_RETENTION_ENABLED:true}
    days: ${ARGOS_RETENTION_DAYS:7}
    # (2026-11-19 ERD V6) 위 days 대신 이 값을 쓴다: 1분 추이·이벤트 샘플·알림 센서 샘플 31일 보관
    # (통계·이력은 한 번에 30일까지 조회, docs/api/stats-history-30days.md). 이벤트·경보·명령 이력은 지우지 않는다
    keep-days: ${ARGOS_RETENTION_KEEP_DAYS:31}
  # VMS 열화상 사진 등 중앙 서버가 받는 파일 저장 위치 (file_asset.path 는 이 폴더 기준 상대 경로)
  files-dir: ${ARGOS_FILES_DIR:./data/files}
  # Redis 로 중앙 서버와 주고받기 (실시간 변화 argos:feed · 센서값 argos:live · 제어 명령 argos:cmd).
  # false 면 지금처럼 HTTP(/internal/feed, /internal/equipment/{id}/commands)만 쓴다
  redis:
    enabled: ${ARGOS_REDIS_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: ${ARGOS_REDIS_ENABLED:false}
